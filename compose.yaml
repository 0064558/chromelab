services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: chromelab
      POSTGRES_USER: chromelab
      POSTGRES_PASSWORD: chromelab_dev
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-55432}:5432"
    volumes:
      - chromelab_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chromelab -d chromelab"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  chromelab_pg:
